version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: baemin-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: delivery
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: